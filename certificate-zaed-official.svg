<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="certBg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#14141c"/>
      <stop offset="60%" stop-color="#09090e"/>
      <stop offset="100%" stop-color="#040406"/>
    </radialGradient>

    <!-- Gold Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5d0"/>
      <stop offset="25%" stop-color="#d4af37"/>
      <stop offset="50%" stop-color="#aa832f"/>
      <stop offset="75%" stop-color="#e8cd87"/>
      <stop offset="100%" stop-color="#916c23"/>
    </linearGradient>

    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffdf5"/>
      <stop offset="50%" stop-color="#dfc8a5"/>
      <stop offset="100%" stop-color="#aa832f"/>
    </linearGradient>

    <!-- Subtle Guilloche Pattern -->
    <pattern id="guilloche" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="18" fill="none" stroke="#c5a880" stroke-width="0.3" opacity="0.15"/>
      <circle cx="20" cy="20" r="12" fill="none" stroke="#c5a880" stroke-width="0.3" opacity="0.12"/>
      <circle cx="20" cy="20" r="6" fill="none" stroke="#00e5ff" stroke-width="0.3" opacity="0.1"/>
    </pattern>
  </defs>

  <!-- Certificate Canvas Base -->
  <rect width="1000" height="700" rx="16" fill="url(#certBg)"/>
  <rect width="1000" height="700" rx="16" fill="url(#guilloche)"/>

  <!-- Ornate Double Gold Outer Border -->
  <rect x="24" y="24" width="952" height="652" rx="12" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>
  <rect x="36" y="36" width="928" height="628" rx="8" fill="none" stroke="#c5a880" stroke-width="1.2" opacity="0.6"/>
  <rect x="42" y="42" width="916" height="616" rx="6" fill="none" stroke="#c5a880" stroke-width="0.8" stroke-dasharray="6,4" opacity="0.4"/>

  <!-- Ornate Corner Flourishes -->
  <g stroke="url(#goldGrad)" stroke-width="2" fill="none">
    <!-- Top-Left -->
    <path d="M 50 85 L 85 50 M 50 95 L 95 50 M 50 105 L 105 50"/>
    <circle cx="65" cy="65" r="8" fill="none" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <circle cx="65" cy="65" r="3" fill="#fff5d0"/>
    <!-- Top-Right -->
    <path d="M 950 85 L 915 50 M 950 95 L 905 50 M 950 105 L 895 50"/>
    <circle cx="935" cy="65" r="8" fill="none" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <circle cx="935" cy="65" r="3" fill="#fff5d0"/>
    <!-- Bottom-Left -->
    <path d="M 50 615 L 85 650 M 50 605 L 95 650 M 50 595 L 105 650"/>
    <circle cx="65" cy="635" r="8" fill="none" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <circle cx="65" cy="635" r="3" fill="#fff5d0"/>
    <!-- Bottom-Right -->
    <path d="M 950 615 L 915 650 M 950 605 L 905 650 M 950 595 L 895 650"/>
    <circle cx="935" cy="635" r="8" fill="none" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <circle cx="935" cy="635" r="3" fill="#fff5d0"/>
  </g>

  <!-- Top Header Crest -->
  <g transform="translate(500, 110)">
    <!-- Crown / Barber Crest -->
    <path d="M -30 20 L -18 -15 L 0 5 L 18 -15 L 30 20 Z" fill="url(#goldGrad)"/>
    <circle cx="-18" cy="-22" r="3.5" fill="#fff5d0"/>
    <circle cx="0" cy="-30" r="4.5" fill="#fff5d0"/>
    <circle cx="18" cy="-22" r="3.5" fill="#fff5d0"/>
    <rect x="-32" y="24" width="64" height="4" rx="2" fill="url(#goldGrad)"/>
  </g>

  <!-- Typography Hierarchy -->
  <text x="500" y="165" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="14" font-weight="700" fill="#c5a880" letter-spacing="8">OFFICIAL ACCREDITATION &amp; CERTIFICATION</text>
  
  <text x="500" y="215" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="34" font-weight="900" fill="url(#goldLight)" letter-spacing="4">CERTIFICATE OF MASTERY</text>
  
  <line x1="320" y1="230" x2="680" y2="230" stroke="url(#goldGrad)" stroke-width="1.5"/>
  <circle cx="500" cy="230" r="4" fill="#d4af37"/>

  <text x="500" y="265" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" fill="#8e8e98" letter-spacing="2">DENGAN INI MENYATAKAN DAN MENGESAHKAN KEAHLIAN MASTER BARBER KEPADA:</text>

  <!-- Recipient Name: ZAED ABIDIN -->
  <text x="500" y="335" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="44" font-weight="900" fill="url(#goldGrad)" letter-spacing="4">ZAED ABIDIN</text>
  <text x="500" y="365" text-anchor="middle" font-family="'Cinzel', serif" font-size="16" font-weight="700" fill="#f5f5f7" letter-spacing="6">BARBER KING'S ZAED ATELIER</text>

  <line x1="260" y1="385" x2="740" y2="385" stroke="#c5a880" stroke-width="1" opacity="0.4"/>

  <!-- Accreditation Body Description -->
  <text x="500" y="420" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-style="italic" font-size="17" fill="#dfc8a5">
    "Telah teruji, tersertifikasi, dan memenuhi standar kompetensi tertinggi dalam seni pemotongan rambut pria presisi,"
  </text>
  <text x="500" y="445" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-style="italic" font-size="17" fill="#dfc8a5">
    "teknik fade bertingkat, ukiran silet (razor art), serta standar sterilisasi higienitas profesional."
  </text>

  <!-- Left: Wahl Professional Stamp -->
  <g transform="translate(200, 530)">
    <circle cx="0" cy="0" r="50" fill="#090910" stroke="url(#goldGrad)" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="44" fill="none" stroke="#c5a880" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="0" y="-12" text-anchor="middle" font-family="'Cinzel', serif" font-size="14" font-weight="800" fill="#fff5d0" letter-spacing="2">WAHL</text>
    <text x="0" y="4" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#d4af37" letter-spacing="1">PROFESSIONAL</text>
    <text x="0" y="18" text-anchor="middle" font-family="'Cinzel', serif" font-size="9" fill="#c5a880">PARTNER</text>
    <path d="M -15 32 L -25 55 L -12 50 L 0 55 L 12 50 L 25 55 L 15 32 Z" fill="url(#goldGrad)"/>
  </g>

  <!-- Center: Master Artisan Seal -->
  <g transform="translate(500, 520)">
    <text x="0" y="0" text-anchor="middle" font-family="'Cinzel', serif" font-size="13" font-weight="700" fill="#d4af37" letter-spacing="2">TERVERIFIKASI &amp; RESMI</text>
    <text x="0" y="20" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#8e8e98">No. Registrasi: BKZ-WAHL-2024-001</text>
    <text x="0" y="38" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#c5a880">Jl. Tanggul, Johar Irigasi, Karawang Timur 41314</text>
  </g>

  <!-- Right: Lead Master Barber Signature -->
  <g transform="translate(770, 520)">
    <!-- Signature Graphic -->
    <path d="M -70 5 Q -40 -25 -10 -5 Q 20 15 50 -10 Q 70 -20 80 -5" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
    <line x1="-80" y1="20" x2="80" y2="20" stroke="#c5a880" stroke-width="1" opacity="0.6"/>
    <text x="0" y="36" text-anchor="middle" font-family="'Cinzel', serif" font-size="12" font-weight="700" fill="#f5f5f7" letter-spacing="1">ZAED ABIDIN</text>
    <text x="0" y="52" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#8e8e98">Lead Master Barber &amp; Founder</text>
  </g>
</svg>
